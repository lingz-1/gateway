{
  "version": 1,
  "outputRoot": "E:\\LingShuData\\evaluations",
  "suites": [
    {
      "id": "semantic-dataset-240",
      "description": "Generate 120 positive and 120 negative deterministic synthetic semantic-cache pairs.",
      "repeat": 1,
      "test": {
        "script": "scripts/generate-semantic-eval-dataset.py",
        "timeoutSeconds": 30
      }
    },
    {
      "id": "semantic-threshold-scan",
      "description": "Scan Qwen3-Embedding-4B similarity thresholds on 240 labelled synthetic pairs.",
      "repeat": 1,
      "service": {
        "startScript": "scripts/start-cache-evaluation.ps1",
        "startArgs": ["-Mode", "Semantic"],
        "startTimeoutSeconds": 300
      },
      "test": {
        "script": "scripts/evaluate_semantic_threshold.py",
        "timeoutSeconds": 300,
        "metrics": [
          "recommended.precision",
          "recommended.recall",
          "recommended.falseHitRate",
          "recommended.falsePositiveRate",
          "embeddingLatencyMs.p50",
          "embeddingLatencyMs.p95"
        ]
      }
    },
    {
      "id": "cache-off-3",
      "description": "Run the common 120-request set with both cache levels disabled.",
      "repeat": 3,
      "service": {
        "startScript": "scripts/start-cache-evaluation.ps1",
        "startArgs": ["-Mode", "Off"]
      },
      "test": {
        "script": "scripts/test-cache-effect.py",
        "args": ["--mode", "off"],
        "timeoutSeconds": 90,
        "metrics": ["hitRate", "providerCallReduction", "latencyMs.p50", "latencyMs.p95", "providerPathLatencyMs.p50"]
      }
    },
    {
      "id": "cache-redis-exact-3",
      "description": "Run the common 120-request set with Redis exact cache for three rounds.",
      "repeat": 3,
      "service": {
        "startScript": "scripts/start-cache-evaluation.ps1",
        "startArgs": ["-Mode", "Exact"]
      },
      "test": {
        "script": "scripts/test-cache-effect.py",
        "args": ["--mode", "exact"],
        "timeoutSeconds": 90,
        "metrics": ["hitRate", "providerCallReduction", "latencyMs.p50", "latencyMs.p95", "cacheHitLatencyMs.p50", "providerPathLatencyMs.p50"]
      }
    },
    {
      "id": "cache-redis-semantic-3",
      "description": "Run the common 120-request set with Redis exact plus Qwen/pgvector semantic cache for three rounds.",
      "repeat": 3,
      "service": {
        "startScript": "scripts/start-cache-evaluation.ps1",
        "startArgs": ["-Mode", "Semantic"],
        "startTimeoutSeconds": 300
      },
      "test": {
        "script": "scripts/test-cache-effect.py",
        "args": ["--mode", "semantic"],
        "timeoutSeconds": 300,
        "metrics": [
          "hitRate",
          "providerCallReduction",
          "latencyMs.p50",
          "latencyMs.p95",
          "cacheHitLatencyMs.p50",
          "providerPathLatencyMs.p50",
          "semanticPositiveHitRate",
          "semanticFalseHitRate",
          "processorLatencyMs.semantic-cache-embedding.p50",
          "processorLatencyMs.semantic-cache-embedding.p95",
          "processorLatencyMs.semantic-cache-vector-query.p50",
          "processorLatencyMs.semantic-cache-vector-query.p95",
          "processorLatencyMs.semantic-cache-write.p50",
          "processorLatencyMs.semantic-cache-write.p95"
        ]
      }
    },
    {
      "id": "cache-fail-open",
      "description": "Verify cache applicability, isolation, and Redis/Embedding/pgvector fail-open behavior with fault injection.",
      "repeat": 1,
      "test": {
        "script": "scripts/test-cache-fail-open.py",
        "timeoutSeconds": 120
      }
    },
    {
      "id": "stream-fallback-30",
      "description": "Fail before the first business delta and fall back without mixed content.",
      "repeat": 30,
      "service": {
        "restartEachIteration": true,
        "environment": {
          "LINGSHU_STUB_MODEL": "stream-fault-model",
          "LINGSHU_FAST_STUB_MODEL": "stream-fault-model",
          "LINGSHU_STUB_STREAM_FAILURE_MODE": "before-first"
        },
        "startArgs": ["-Cache", "Off"]
      },
      "test": {
        "script": "scripts/test-stream-faults.py",
        "args": ["--scenario", "fallback"],
        "timeoutSeconds": 20
      }
    },
    {
      "id": "stream-truncation-30",
      "description": "Truncate after two deltas and require an SSE error without fallback or DONE.",
      "repeat": 30,
      "service": {
        "environment": {
          "LINGSHU_STUB_MODEL": "stream-fault-model",
          "LINGSHU_FAST_STUB_MODEL": "stub-fast-v1",
          "LINGSHU_STUB_STREAM_CHUNKS": "5",
          "LINGSHU_STUB_STREAM_DELAY": "20ms",
          "LINGSHU_STUB_STREAM_FAILURE_MODE": "truncate-after-chunks",
          "LINGSHU_STUB_STREAM_FAILURE_AFTER_CHUNKS": "2"
        },
        "startArgs": ["-Cache", "Off"]
      },
      "test": {
        "script": "scripts/test-stream-faults.py",
        "args": ["--scenario", "truncation"],
        "timeoutSeconds": 20
      }
    },
    {
      "id": "stream-cancellation-30",
      "description": "Cancel a slow stream and verify idempotent duplicate cancellation.",
      "repeat": 30,
      "service": {
        "environment": {
          "LINGSHU_STUB_MODEL": "stub-echo-v1",
          "LINGSHU_FAST_STUB_MODEL": "stub-fast-v1",
          "LINGSHU_STUB_STREAM_CHUNKS": "5",
          "LINGSHU_STUB_STREAM_DELAY": "200ms",
          "LINGSHU_STUB_STREAM_FAILURE_MODE": "none"
        },
        "startArgs": ["-Cache", "Off"]
      },
      "test": {
        "script": "scripts/test-cluster-stream-cancel.py",
        "args": [
          "--stream-core", "http://127.0.0.1:8080",
          "--cancel-core", "http://127.0.0.1:8080"
        ],
        "timeoutSeconds": 20,
        "metrics": ["cancelRequestLatencyMs", "streamStoppedAfterCancelMs"]
      }
    },
    {
      "id": "provider-resilience-30",
      "description": "Repeat transient retry, circuit opening, and post-cooldown recovery thirty times each.",
      "repeat": 1,
      "test": {
        "script": "scripts/test-provider-resilience.py",
        "timeoutSeconds": 90
      }
    },
    {
      "id": "budget-consistency",
      "description": "Verify concurrent Redis reservations, idempotent ledger transitions, and atomic virtual balances.",
      "repeat": 1,
      "test": {
        "script": "scripts/test-budget-consistency.py",
        "timeoutSeconds": 120
      }
    }
  ]
}
