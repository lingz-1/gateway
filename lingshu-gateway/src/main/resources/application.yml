server:
  port: 8080

spring:
  application:
    name: lingshu-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: lingshu-core
              uri: ${LINGSHU_CORE_URI:http://localhost:8081}
              predicates:
                - Path=/v1/**

lingshu:
  gateway:
    api-key:
      enabled: ${LINGSHU_GATEWAY_API_KEY_ENABLED:false}
      value: ${LINGSHU_GATEWAY_API_KEY:}
    request-policy:
      tenant-id-required: ${LINGSHU_GATEWAY_TENANT_ID_REQUIRED:true}
      max-body-bytes: ${LINGSHU_GATEWAY_MAX_BODY_BYTES:20971520}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
