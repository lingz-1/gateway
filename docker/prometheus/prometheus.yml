global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: lingshu-core
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
  - job_name: lingshu-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
