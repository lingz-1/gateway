name: lingshu

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: lingshu
      POSTGRES_USER: lingshu
      POSTGRES_PASSWORD: ${LINGSHU_POSTGRES_PASSWORD:?Set LINGSHU_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      - type: bind
        source: ${LINGSHU_DATA_ROOT:-E:/LingShuData}/postgres
        target: /var/lib/postgresql/data
      - type: bind
        source: ./docker/postgres/init/001-enable-vector.sql
        target: /docker-entrypoint-initdb.d/001-enable-vector.sql
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - lingshu-infra

  redis:
    image: redis:8.10.1-alpine
    environment:
      LINGSHU_REDIS_PASSWORD: ${LINGSHU_REDIS_PASSWORD:?Set LINGSHU_REDIS_PASSWORD in .env}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$LINGSHU_REDIS_PASSWORD"
    ports:
      - "127.0.0.1:63790:6379"
    volumes:
      - type: bind
        source: ${LINGSHU_DATA_ROOT:-E:/LingShuData}/redis
        target: /data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$LINGSHU_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - lingshu-infra

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-1.9
    gpus: all
    command:
      - --model-id
      - /data
      - --pooling
      - last-token
      - --auto-truncate
      - --max-batch-tokens
      - "4096"
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - type: bind
        source: ${LINGSHU_DATA_ROOT:-E:/LingShuData}/models/Qwen3-Embedding-4B
        target: /data
        read_only: true
    restart: unless-stopped
    networks:
      - lingshu-infra

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - type: bind
        source: ${LINGSHU_DATA_ROOT:-E:/LingShuData}/kafka
        target: /var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - lingshu-infra

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - type: bind
        source: ./docker/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: bind
        source: ${LINGSHU_DATA_ROOT:-E:/LingShuData}/prometheus
        target: /prometheus
    restart: unless-stopped
    networks:
      - lingshu-infra

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${LINGSHU_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${LINGSHU_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - type: bind
        source: ${LINGSHU_DATA_ROOT:-E:/LingShuData}/grafana
        target: /var/lib/grafana
      - type: bind
        source: ./docker/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
      - type: bind
        source: ./docker/grafana/dashboards
        target: /var/lib/grafana-dashboards
        read_only: true
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - lingshu-infra

networks:
  lingshu-infra:
    name: lingshu-infra
